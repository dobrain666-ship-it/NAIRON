<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ADMIN — ɴᴀɪʀᴏɴ x ᴍᴀᴠɪᴀ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:20px;}
  .wrap{max-width:640px;margin:0 auto;}
  h1{font-size:18px;letter-spacing:6px;font-weight:600;background:linear-gradient(90deg,#00e5ff,#b14dff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:8px;}
  .sub{text-align:center;font-size:11px;letter-spacing:3px;color:#556;margin-bottom:28px;text-transform:uppercase;}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(0,229,255,.2);border-radius:14px;padding:20px;margin-bottom:16px;}
  .card h2{font-size:11px;letter-spacing:3px;color:#00e5ff;text-transform:uppercase;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:10px;letter-spacing:2px;color:#667;text-transform:uppercase;}
  .field input{width:100%;padding:12px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(0,229,255,.25);border-radius:10px;color:#fff;font-size:14px;outline:none;font-family:inherit;letter-spacing:1px;}
  .field input:focus{border-color:#00e5ff;}
  .btn{padding:12px 22px;border:none;border-radius:10px;background:linear-gradient(90deg,#00e5ff,#b14dff);color:#000;font-size:12px;font-weight:700;letter-spacing:3px;cursor:pointer;text-transform:uppercase;font-family:inherit;}
  .btn:hover{box-shadow:0 0 20px rgba(0,229,255,.4);}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .status{margin-top:10px;font-size:12px;letter-spacing:2px;color:#00e5ff;}
  .status.err{color:#ff4d4d;}
  .status.ok{color:#00e5a0;}
  .toggle{display:flex;align-items:center;gap:14px;}
  .switch{position:relative;width:56px;height:30px;background:#222;border-radius:30px;cursor:pointer;transition:background .3s;}
  .switch.on{background:linear-gradient(90deg,#00e5ff,#b14dff);}
  .switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .3s;}
  .switch.on::after{transform:translateX(26px);}
  .pw-list{list-style:none;}
  .pw-list li{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:rgba(255,255,255,.03);border-radius:10px;margin-bottom:8px;font-size:13px;letter-spacing:1px;gap:10px;}
  .pw-list li span.name{color:#00e5ff;font-weight:600;}
  .pw-list li span.val{color:#889;font-family:monospace;flex:1;}
  .del{background:#ff4d4d;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer;letter-spacing:2px;}
  a.back{display:inline-block;margin-top:20px;color:#00e5ff;text-decoration:none;font-size:12px;letter-spacing:3px;text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <h1>ɴᴀɪʀᴏɴ x ᴍᴀᴠɪᴀ — ADMIN</h1>
  <div class="sub">control panel</div>

  <!-- TOKEN -->
  <div class="card">
    <h2>API Token</h2>
    <div class="field">
      <input type="text" id="tokenInput" placeholder="bearer token" />
    </div>
    <button class="btn" id="saveToken">SAVE TOKEN</button>
    <div class="status" id="tokenStatus"></div>
  </div>

  <!-- API BASE -->
  <div class="card">
    <h2>API Endpoint</h2>
    <div class="field">
      <input type="text" id="apiBaseInput" placeholder="https://..." />
    </div>
    <button class="btn" id="saveApiBase">SAVE ENDPOINT</button>
    <div class="status" id="apiStatus"></div>
  </div>

  <!-- MAINTENANCE -->
  <div class="card">
    <h2>Maintenance Mode</h2>
    <div class="toggle">
      <div class="switch" id="maintSwitch"></div>
      <span id="maintLabel">OFF</span>
    </div>
    <div class="status" id="maintStatus"></div>
  </div>

  <!-- PASSWORDS -->
  <div class="card">
    <h2>Access Keys</h2>
    <ul class="pw-list" id="pwList"></ul>
    <div class="row" style="margin-top:14px;">
      <div class="field" style="flex:1;min-width:120px;">
        <label>Name</label>
        <input type="text" id="newPwName" placeholder="e.g. VIP" />
      </div>
      <div class="field" style="flex:1;min-width:120px;">
        <label>Key</label>
        <input type="text" id="newPwVal" placeholder="value" />
      </div>
    </div>
    <button class="btn" id="addPw">ADD KEY</button>
    <div class="status" id="pwStatus"></div>
  </div>

  <a class="back" href="/">← back to site</a>
</div>

<script>
const $ = id => document.getElementById(id);
async function api(path, opts={}) {
  const res = await fetch(path, {
    credentials: 'same-origin',
    headers: { 'Content-Type': 'application/json' },
    ...opts
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { window.location.href = '/'; }
  return data;
}

async function loadStatus() {
  const data = await api('/api/admin/status');
  if (!data.success) return;
  $('tokenInput').value = data.token || '';
  $('apiBaseInput').value = data.api_base || '';
  updateMaintUI(data.maintenance);
  renderPwList(data.passwords || []);
}

function updateMaintUI(on) {
  $('maintSwitch').classList.toggle('on', !!on);
  $('maintLabel').textContent = on ? 'ON' : 'OFF';
}

function renderPwList(names) {
  const ul = $('pwList');
  ul.innerHTML = '';
  names.forEach(n => {
    const li = document.createElement('li');
    const isAdmin = n === 'ADMIN';
    li.innerHTML = `<span class="name">${n}</span><span class="val">${isAdmin ? '• primary admin' : '• active'}</span>`;
    if (!isAdmin) {
      const btn = document.createElement('button');
      btn.textContent = 'DEL'; btn.className = 'del';
      btn.onclick = async () => {
        await api('/api/admin/password/delete', { method:'POST', body: JSON.stringify({ name: n }) });
        loadStatus();
      };
      li.appendChild(btn);
    }
    ul.appendChild(li);
  });
}

$('saveToken').onclick = async () => {
  const token = $('tokenInput').value.trim();
  const r = await api('/api/admin/token', { method:'POST', body: JSON.stringify({ token }) });
  $('tokenStatus').textContent = r.success ? 'token updated ✓' : (r.error || 'failed');
  $('tokenStatus').className = 'status ' + (r.success ? 'ok' : 'err');
};

$('saveApiBase').onclick = async () => {
  const api_base = $('apiBaseInput').value.trim();
  const r = await api('/api/admin/api_base', { method:'POST', body: JSON.stringify({ api_base }) });
  $('apiStatus').textContent = r.success ? 'endpoint updated ✓' : (r.error || 'failed');
  $('apiStatus').className = 'status ' + (r.success ? 'ok' : 'err');
};

$('maintSwitch').onclick = async () => {
  const on = !$('maintSwitch').classList.contains('on');
  const r = await api('/api/admin/maintenance', { method:'POST', body: JSON.stringify({ on }) });
  if (r.success) { updateMaintUI(r.maintenance); $('maintStatus').textContent = 'maintenance ' + (r.maintenance ? 'ON' : 'OFF'); $('maintStatus').className='status ok'; }
};

$('addPw').onclick = async () => {
  const name = $('newPwName').value.trim();
  const value = $('newPwVal').value.trim();
  if (!name || !value) { $('pwStatus').textContent='name/value required'; $('pwStatus').className='status err'; return; }
  const r = await api('/api/admin/password', { method:'POST', body: JSON.stringify({ name, value }) });
  if (r.success) { $('newPwName').value=''; $('newPwVal').value=''; $('pwStatus').textContent='key added ✓'; $('pwStatus').className='status ok'; loadStatus(); }
  else { $('pwStatus').textContent = r.error || 'failed'; $('pwStatus').className='status err'; }
};

loadStatus();
</script>
</body>
</html>
